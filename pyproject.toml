[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-control"
version = "0.1.0"
description = "Cross-platform, offline hand-gesture and voice control for your computer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "AI Vision Gesture Control Tool contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Core dependencies required for the gesture/vision pipeline. Kept minimal so
# a gesture-only install never pulls in audio/voice dependencies.
dependencies = [
    "opencv-python>=4.9,<5",
    # Pinned <1.0: mediapipe==1.0.0/1.0.1 crash HandLandmarker on some macOS
    # setups with "Check failed: service_ Service is unavailable." inside
    # DrishtiMetalHelper/TensorsToDetectionsCalculator, reproduced even with
    # the CPU delegate and in IMAGE running mode. 0.10.35 does not have this
    # bug. See docs/KNOWN_ISSUES.md before bumping this pin.
    "mediapipe>=0.10.30,<0.11",
    "numpy>=1.26,<3",
    "pynput>=1.7,<2",
    "pyautogui>=0.9.54,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Voice agent stack. Installed separately (`pip install -e ".[voice]"`) since
# it is not required for the gesture-only experience.
voice = [
    "openwakeword>=0.6,<1",
    "faster-whisper>=1.0,<2",
    "piper-tts>=1.2,<2",
    "sounddevice>=0.5,<1",
    "moonshine-voice==0.1.5",
    "mlx-whisper>=0.4,<1",
]
# Development / quality tooling.
dev = [
    "black>=24.0,<25",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
]

[project.scripts]
gesture-control = "gesture_control.app:main"

[tool.setuptools.packages.find]
include = ["gesture_control*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["gesture_control", "tests"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle core, I = import sorting, UP = pyupgrade,
# B = bugbear (common bug patterns), N = pep8-naming, D = pydocstyle (docstring presence/style).
select = ["E", "F", "I", "UP", "B", "N", "D"]
ignore = [
    "D203", # conflicts with D211 (we want no blank line before class docstring)
    "D213", # conflicts with D212 (we want docstring summary on the first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests don't need module/function docstrings on every case

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests/unit"]

[tool.coverage.run]
source = ["gesture_control"]
